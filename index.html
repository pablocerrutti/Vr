<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Visor Nocturno VR & Telemetría</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- OJO IZQUIERDO -->
  <div class="vr-eye" id="eye-left">
    <video class="camera-stream" autoplay playsinline muted></video>
    <canvas class="reticle-canvas"></canvas>
    <div class="hud-overlay">
      <div class="hud-item">DIST: <span class="dist-val">--</span> m</div>
      <div class="hud-item">MODO: <span class="mode-val">NOCTURNO</span></div>
    </div>
  </div>

  <!-- OJO DERECHO -->
  <div class="vr-eye" id="eye-right">
    <video class="camera-stream" autoplay playsinline muted></video>
    <canvas class="reticle-canvas"></canvas>
    <div class="hud-overlay">
      <div class="hud-item">DIST: <span class="dist-val">--</span> m</div>
      <div class="hud-item">MODO: <span class="mode-val">NOCTURNO</span></div>
    </div>
  </div>

  <!-- CONTROLES TÁCTILES DENTRO DEL COMPARTIMENTO / TECLAS -->
  <div id="controls-ui">
    <button id="btn-mode">Cambiar Filtro</button>
    <button id="btn-size-up">Objeto +</button>
    <button id="btn-size-down">Objeto -</button>
  </div>

  <script src="js/camera.js"></script>
  <script src="js/reticle.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
