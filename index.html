<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Visor Nocturno VR</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="orientation-warning">GIRA EL DISPOSITIVO<br>HORIZONTALMENTE</div>

  <!-- OJO IZQUIERDO -->
  <div class="vr-eye" id="eye-left">
    <video class="camera-stream" autoplay playsinline muted></video>
    <canvas class="reticle-canvas"></canvas>
    <div class="hud-overlay">
      <div class="hud-item">REF: <span class="ref-val">30 M</span></div>
      <div class="hud-item">MODO: <span class="mode-val">NOCTURNO</span></div>
    </div>
  </div>

  <!-- OJO DERECHO -->
  <div class="vr-eye" id="eye-right">
    <video class="camera-stream" autoplay playsinline muted></video>
    <canvas class="reticle-canvas"></canvas>
    <div class="hud-overlay">
      <div class="hud-item">REF: <span class="ref-val">30 M</span></div>
      <div class="hud-item">MODO: <span class="mode-val">NOCTURNO</span></div>
    </div>
  </div>

  <div id="sensor-status">SENSORES: ESPERANDO</div>

  <!-- Controles pensados para la preparación antes de colocar el teléfono en el VR Box -->
  <div id="controls-ui">
    <button id="btn-sensors">Activar sensores</button>
    <button id="btn-mode">Cambiar filtro</button>
    <button id="btn-horizon">Horizonte ON/OFF</button>
  </div>

  <script src="js/camera.js"></script>
  <script src="js/reticle.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
