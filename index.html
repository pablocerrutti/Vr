<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Visor Nocturno"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="application-name"
        content="LoneWolf Visor Nocturno"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>LoneWolf Visor Nocturno</title>
</head>

<body>

    <!-- =========================================
         CONTENEDOR PRINCIPAL
    ========================================== -->

    <main id="visor">

        <!-- =====================================
             CÁMARA
        ====================================== -->

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>


        <!-- =====================================
             CAPA DE VISIÓN NOCTURNA
        ====================================== -->

        <canvas
            id="nightVisionCanvas"
        ></canvas>


        <!-- =====================================
             RETÍCULA
        ====================================== -->

        <div
            id="reticle"
            class="reticle"
        >

            <!-- Línea vertical -->
            <div
                class="reticle-vertical"
            ></div>

            <!-- Línea horizontal -->
            <div
                class="reticle-horizontal"
            ></div>

            <!-- Centro -->
            <div
                class="reticle-center"
            ></div>

            <!-- =================================
                 ESCALA DE DISTANCIA
            ================================== -->

            <div
                id="rangeScale"
                class="range-scale"
            >

                <div
                    class="range-line range-20"
                >
                    <span>20</span>
                </div>

                <div
                    class="range-line range-30"
                >
                    <span>30</span>
                </div>

                <div
                    class="range-line range-40"
                >
                    <span>40</span>
                </div>

                <div
                    class="range-line range-50"
                >
                    <span>50</span>
                </div>

                <div
                    class="range-line range-60"
                >
                    <span>60</span>
                </div>

                <div
                    class="range-line range-75"
                >
                    <span>75</span>
                </div>

                <div
                    class="range-line range-100"
                >
                    <span>100</span>
                </div>

            </div>

        </div>


        <!-- =====================================
             INFORMACIÓN SUPERIOR
        ====================================== -->

        <div
            id="topInfo"
            class="top-info"
        >

            <span id="appName">
                LONEWOLF NIGHT VISION
            </span>

            <span id="status">
                OFFLINE
            </span>

        </div>


        <!-- =====================================
             INFORMACIÓN DE DISTANCIA
        ====================================== -->

        <div
            id="distanceInfo"
            class="distance-info"
        >
            OBJETIVO 45 × 40 CM
        </div>


        <!-- =====================================
             CONTROLES
        ====================================== -->

        <div
            id="controls"
            class="controls"
        >

            <!-- Iniciar cámara -->

            <button
                id="startCamera"
                type="button"
            >
                CÁMARA
            </button>


            <!-- Visión nocturna -->

            <button
                id="nightVision"
                type="button"
            >
                NV
            </button>


            <!-- Retícula -->

            <button
                id="toggleReticle"
                type="button"
            >
                RETÍCULA
            </button>


            <!-- Escala -->

            <button
                id="toggleScale"
                type="button"
            >
                ESCALA
            </button>


            <!-- Cambio de cámara -->

            <button
                id="switchCamera"
                type="button"
            >
                ↻
            </button>

        </div>


        <!-- =====================================
             INDICADOR DE VERSIÓN
        ====================================== -->

        <div
            id="version"
            class="version"
        >
            V2
        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT PRINCIPAL
    ========================================== -->

    <script src="./app.js"></script>


    <!-- =========================================
         SERVICE WORKER / ACTUALIZACIONES
    ========================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker
                .register("./sw.js")
                .then(registration => {

                    console.log(
                        "Service Worker registrado:",
                        registration.scope
                    );


                    /*
                     * Comprobar periódicamente si existe
                     * una nueva versión.
                     */

                    setInterval(() => {

                        registration.update();

                    }, 60 * 1000);


                    /*
                     * Detectar una nueva versión.
                     */

                    registration.addEventListener(
                        "updatefound",
                        () => {

                            const newWorker =
                                registration.installing;

                            if (!newWorker) {
                                return;
                            }


                            newWorker.addEventListener(
                                "statechange",
                                () => {

                                    if (
                                        newWorker.state ===
                                        "installed" &&
                                        navigator
                                            .serviceWorker
                                            .controller
                                    ) {

                                        /*
                                         * Nueva versión
                                         * disponible.
                                         */

                                        newWorker.postMessage({
                                            type:
                                                "SKIP_WAITING"
                                        });

                                    }

                                }
                            );

                        }
                    );

                })
                .catch(error => {

                    console.error(
                        "Error registrando Service Worker:",
                        error
                    );

                });


            /*
             * Cuando el nuevo Service Worker toma
             * el control, recargamos la aplicación.
             */

            navigator.serviceWorker.addEventListener(
                "controllerchange",
                () => {

                    window.location.reload();

                }
            );

        }

    </script>

</body>
</html>
