<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Night Vision"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Night Vision</title>

</head>

<body>

    <div id="app">

        <!-- =================================
             CÁMARA
        ================================== -->

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <!-- =================================
             PROCESAMIENTO DE IMAGEN
        ================================== -->

        <canvas
            id="nightCanvas"
        ></canvas>


        <!-- =================================
             RETÍCULA VISUAL
        ================================== -->

        <div
            id="reticle"
            class="reticle hidden"
        >

            <div class="reticle-horizontal"></div>

            <div class="reticle-vertical"></div>

            <div class="reticle-center"></div>

        </div>


        <!-- =================================
             INFORMACIÓN
        ================================== -->

        <div id="hud">

            <div id="hudTop">

                <span id="appTitle">
                    NIGHT VISION
                </span>

                <span id="cameraStatus">
                    OFFLINE
                </span>

            </div>


            <div id="loading">

                <div class="loading-title">
                    NIGHT VISION
                </div>

                <div class="loading-text">
                    Iniciando cámara...
                </div>

            </div>

        </div>


        <!-- =================================
             CONTROLES
        ================================== -->

        <div id="controls">

            <button
                id="cameraButton"
                class="control-button"
                type="button"
            >
                CÁMARA
            </button>

            <button
                id="nightButton"
                class="control-button active"
                type="button"
            >
                NV
            </button>

            <button
                id="reticleButton"
                class="control-button"
                type="button"
            >
                RETÍCULA
            </button>

            <button
                id="switchButton"
                class="control-button small"
                type="button"
            >
                ↻
            </button>

        </div>


        <!-- =================================
             VERSIÓN
        ================================== -->

        <div id="version">
            V1.0.0
        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT PRINCIPAL
    ====================================== -->

    <script src="./app.js"></script>


    <!-- =====================================
         SERVICE WORKER
    ====================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker
                .register("./sw.js")
                .then(registration => {

                    console.log(
                        "Service Worker activo"
                    );

                    /*
                     * Comprobar actualizaciones
                     * periódicamente.
                     */

                    setInterval(() => {

                        registration.update();

                    }, 60000);

                })
                .catch(error => {

                    console.error(
                        "Service Worker:",
                        error
                    );

                });


            /*
             * Cuando una versión nueva toma
             * el control, recargar.
             */

            navigator.serviceWorker.addEventListener(
                "controllerchange",
                () => {

                    window.location.reload();

                }
            );

        }

    </script>

</body>
</html>
